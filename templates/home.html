<!DOCTYPE html>
{%  load static %}

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio Web JX</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Work+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'ico/logo.ico' %}">

  <!-- Global CSS (Neon Nebula design system) -->
  <link rel="stylesheet" href="{% static 'global.css' %}">

  <!-- App JS -->
  <script src="{% static 'js/app.js' %}"></script>

  <style>
    /* Base dark background always */
    html, body { background: #0f0f14 !important; color: #e8e8f0 !important; }

    /* CKEditor adjustments */
    .ck-editor__editable { min-height: 80px !important; max-height: 120px !important; }
    .ck-word-count { display: none !important; }

    /* Blog/legacy header banner */
    .header-img {
      background-image: linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)), url('/static/img/banner.png');
      background-size: cover;
      background-position: center;
    }

    /* Alert messages dark style */
    .alert-success { background:#14532d!important; color:#86efac!important; border:1px solid #166534!important; }
    .alert-error   { background:#7f1d1d!important; color:#fca5a5!important; border:1px solid #991b1b!important; }
    .alert-warning { background:#78350f!important; color:#fde68a!important; border:1px solid #92400e!important; }
    .alert-info    { background:#1e3a5f!important; color:#93c5fd!important; border:1px solid #1d4ed8!important; }
  </style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

  {% include "includes/nav.html" %}

  <!-- Flash messages (posicionados en la parte superior) -->
  {% if messages %}
  <div style="position:fixed;top:5rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;max-width:360px;">
    {% for message in messages %}
      <div style="padding:.85rem 1.1rem;border-radius:.75rem;font-size:.88rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);
        {% if message.tags == 'success' %}background:#14532d;color:#86efac;border:1px solid #166534;
        {% elif message.tags == 'error' %}background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b;
        {% elif message.tags == 'warning' %}background:#78350f;color:#fde68a;border:1px solid #92400e;
        {% else %}background:#1e3a5f;color:#93c5fd;border:1px solid #1d4ed8;
        {% endif %}"
        role="alert">
        {{ message|capfirst }}
      </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Main content -->
  <main style="flex:1;">
    {% block content %}{% endblock %}
  </main>

  {% include "includes/footer.html" %}

  {% block scripts %}{% endblock %}

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</body>
</html>
